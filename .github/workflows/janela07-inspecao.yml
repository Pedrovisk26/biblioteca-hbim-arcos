name: Janela 07 — inspeção e tratamento (uso único)

on:
  push:
    branches: [claude/upbeat-fermat-2nwn39]
    paths: [.github/workflows/janela07-inspecao.yml]

permissions:
  contents: write

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      RASCUNHO_ID: "457232747"
      ID: HBIM-JAN-0007
    steps:
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg 7zip unzip > /dev/null
          pip install -q ifcopenshell
          df -h . | tail -1
      - name: Baixar anexos do rascunho
        run: |
          mkdir -p orig
          gh api "repos/$R/releases/$RASCUNHO_ID/assets" --jq '.[] | "\(.id)\t\(.name)\t\(.size)"' | tee lista.tsv
          while IFS=$'\t' read -r id nome tam; do
            gh api -H "Accept: application/octet-stream" "repos/$R/releases/assets/$id" > "orig/$nome"
            echo "$nome $(stat -c %s "orig/$nome") (esperado $tam)"; file "orig/$nome"
          done < lista.tsv
      - name: Extrair
        run: |
          mkdir -p ext
          cd orig
          primeiro=$(ls | grep -E '\.(001|z01)$|\.part0*1\.' | head -1 || true)
          if [ -n "$primeiro" ]; then
            echo "volumes divididos: $primeiro"; 7z x -y -o../ext "$primeiro" > /dev/null
          else
            for z in *; do echo "extraindo $z"; 7z x -y -o"../ext/${z%.*}" "$z" > /dev/null; done
          fi
          cd .. && rm -rf orig
          find ext -type f -printf '%s\t%p\n' | sort -k2 | tee arvore.txt
          df -h . | tail -1
      - name: Relatório
        run: |
          mkdir -p rel/quadros rel/ifc video
          cp arvore.txt rel/
          find ext -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4v' \) | while read -r f; do
            echo "## video $f"
            ffprobe -v error -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate:stream_side_data=rotation -of compact "$f"
          done | tee -a rel/relatorio.txt
          find ext -type f -iname '*.ifc' | while read -r f; do
            cp "$f" rel/ifc/
            python3 - "$f" <<'PY' | tee -a rel/relatorio.txt
          import sys, ifcopenshell
          f = ifcopenshell.open(sys.argv[1])
          print("## ifc", sys.argv[1], f.schema)
          for w in f.by_type("IfcWindow"):
              print("janela:", w.Name, "| tag:", w.Tag, "| L x A:", w.OverallWidth, w.OverallHeight)
          print("solidos:", len(f.by_type("IfcExtrudedAreaSolid")), "| materiais:", sorted({m.Name for m in f.by_type("IfcMaterial")}))
          PY
          done
          find ext -type f -iname '*.obj' | while read -r f; do
            echo "## obj $f vertices=$(grep -c '^v ' "$f") faces=$(grep -c '^f ' "$f")"
            grep -m3 -E '^(mtllib|usemtl)' "$f" || true
          done | tee -a rel/relatorio.txt
          find ext -type f \( -iname '*.md' -o -iname '*.json' -o -iname '*.cff' -o -iname '*.txt' -o -iname '*.html' \) -size -2M -exec cp --parents {} rel/ \;
      - name: Tratar vídeo (sem áudio, sem metadados, H.264 608x1080)
        run: |
          find ext -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4v' \) | sort > videos.txt
          n=0
          while read -r f; do
            n=$((n+1)); out="video/${ID}_referencia-sem-audio_h264_v0.2.0.mp4"
            [ "$n" -gt 1 ] && out="video/${ID}_referencia-sem-audio_h264_v0.2.0_$n.mp4"
            echo "$f -> $out"
            ffmpeg -nostdin -hide_banner -loglevel error -i "$f" -map 0:v:0 -an -sn -dn \
              -map_metadata -1 -map_chapters -1 \
              -vf "scale=608:1080:force_original_aspect_ratio=increase,crop=608:1080,setsar=1,fps=30" \
              -c:v libx264 -profile:v main -level:v 3.1 -preset slow -b:v 5M -maxrate 6M -bufsize 10M \
              -pix_fmt yuv420p -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv \
              -fflags +bitexact -flags:v +bitexact -movflags +faststart "$out"
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out")
            ffmpeg -nostdin -hide_banner -loglevel error -i "$out" \
              -vf "fps=12/$dur,scale=200:-2,tile=6x2:padding=4" -frames:v 1 "rel/quadros/$(basename "$out" .mp4).jpg"
            ffprobe -v error -show_entries format=duration,size:format_tags:stream=codec_type,codec_name,width,height -of compact "$out"
          done < videos.txt
          ls -l video; (cd video && sha256sum *.mp4 | tee SHA256SUMS-videos.txt) || true
      - uses: actions/upload-artifact@v4
        with: {name: relatorio, path: rel/, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: video-tratado, path: video/, retention-days: 3, compression-level: 0}
