name: Atualizar Release v0.2.0 (uso único)

on:
  push:
    branches: [claude/upbeat-fermat-2nwn39]
    paths: [envio-release-v0.2.0/**]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.2.0
    steps:
      - uses: actions/checkout@v4
      - name: Conferir pacotes antes do envio
        run: |
          if [ ! -f envio-release-v0.2.0/SHA256SUMS.txt ]; then echo "Pasta de envio removida; nada a fazer."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          cd envio-release-v0.2.0
          sha256sum -c --ignore-missing SHA256SUMS.txt
          ls -l
      - name: Remover arquivos antigos da Release
        if: env.SKIP != '1'
        run: |
          for a in HBIM-JAN-0014_hbim_v0.2.0.zip HBIM-JAN-0015_hbim_v0.2.0.zip HBIM-JAN-0016_hbim_v0.2.0.zip \
                   HBIM-JAN-0017_hbim_v0.2.0.zip HBIM-JAN-0018_hbim_v0.2.0.zip \
                   HBIM-POR-0001_hbim_v0.2.0.zip SHA256SUMS-porta-01.txt; do
            gh release delete-asset "$TAG" "$a" -y || echo "não encontrado: $a"
          done
      - name: Enviar arquivos novos
        if: env.SKIP != '1'
        run: |
          cd envio-release-v0.2.0
          gh release upload "$TAG" HBIM-JAN-0004_hbim_v0.2.0.zip HBIM-JAN-0010_hbim_v0.2.0.zip \
            HBIM-JAN-0011_hbim_v0.2.0.zip HBIM-JAN-0012_hbim_v0.2.0.zip HBIM-JAN-0013_hbim_v0.2.0.zip \
            SHA256SUMS.txt --clobber
      - name: Atualizar título e notas
        if: env.SKIP != '1'
        run: gh release edit "$TAG" --title "Biblioteca HBIM v0.2.0 — nove janelas em IFC4" --notes-file envio-release-v0.2.0/notas.md
      - name: Listar arquivos da Release
        if: env.SKIP != '1'
        run: gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
