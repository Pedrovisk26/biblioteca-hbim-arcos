name: Janela 07 — vídeo com desfoque e pacote (uso único)
# execução 2: inclui o IFC

on:
  push:
    branches: [claude/upbeat-fermat-2nwn39]
    paths: [.github/workflows/janela07-pacote.yml]

permissions:
  contents: read

jobs:
  pacote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      RASCUNHO_ID: "457232747"
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg 7zip > /dev/null
      - name: Extrair o vídeo original
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$R/releases/$RASCUNHO_ID/assets" --jq '.[] | select(.name=="projeto-janela-07.zip") | .id')
          gh api -H "Accept: application/octet-stream" "repos/$R/releases/assets/$id" > fonte.zip
          7z e -y -oorig fonte.zip 'projeto-janela-07/Janela_07.mp4' > /dev/null && rm fonte.zip
          ls -l orig
      - name: Converter com desfoque do trecho da rua
        run: |
          mkdir -p saida
          out=saida/HBIM-JAN-0007_referencia-sem-audio_h264_v0.2.0.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -i orig/Janela_07.mp4 -an -sn -dn \
            -map_metadata -1 -map_chapters -1 \
            -filter_complex "[0:v:0]scale=608:1080:force_original_aspect_ratio=increase,crop=608:1080,setsar=1,fps=30,split[a][b];[b]crop=420:640:0:440,boxblur=24:6[bl];[a][bl]overlay=0:440:enable='between(t,35.3,39.8)',format=yuv420p[v]" \
            -map "[v]" -c:v libx264 -profile:v main -level:v 3.1 -preset slow -b:v 5M -maxrate 6M -bufsize 10M \
            -pix_fmt yuv420p -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv \
            -fflags +bitexact -flags:v +bitexact -movflags +faststart "$out"
          ffprobe -v error -show_entries format=duration,size:format_tags:stream=codec_type,codec_name,profile,width,height,r_frame_rate:stream_tags -of compact "$out"
          ffmpeg -nostdin -v error -ss 34 -t 7 -i "$out" -vf "fps=2,scale=150:-2,tile=7x2:padding=2" -frames:v 1 -q:v 6 verif.jpg
          ffmpeg -nostdin -v error -i "$out" -vf "fps=1/2,scale=100:-2,tile=12x3:padding=2" -frames:v 1 -q:v 8 geral.jpg
          for f in verif.jpg geral.jpg; do echo "BEGIN-$f"; base64 -w 0 "$f"; echo; echo "END-$f"; done
      - name: Montar pacote
        run: |
          mkdir -p pacote
          python3 envio-janela07/montar.py envio-janela07 saida/HBIM-JAN-0007_referencia-sem-audio_h264_v0.2.0.mp4 pacote/HBIM-JAN-0007_hbim_v0.2.0.zip
      - uses: actions/upload-artifact@v4
        with: {name: pacote-janela07, path: pacote/, retention-days: 3, compression-level: 0}
