name: Vídeos v0.2.0 — etapa 1 (tratamento, uso único)

on:
  push:
    branches: [claude/upbeat-fermat-2nwn39]
    paths: [.github/workflows/videos-etapa1.yml]

permissions:
  contents: write

jobs:
  tratar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      RASCUNHO_ID: "456835641"
    steps:
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: Baixar vídeos do rascunho
        run: |
          mkdir -p orig
          gh api "repos/$R/releases/$RASCUNHO_ID/assets" --jq '.[] | "\(.id)\t\(.name)\t\(.size)"' > lista.tsv
          cat lista.tsv
          while IFS=$'\t' read -r id nome tam; do
            gh api -H "Accept: application/octet-stream" "repos/$R/releases/assets/$id" > "orig/$nome"
            echo "baixado: $nome $(stat -c %s "orig/$nome") bytes (esperado $tam)"
          done < lista.tsv
      - name: Inspecionar originais
        run: |
          for f in orig/*; do
            echo "=== $f"
            ffprobe -v error -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate:stream_side_data=rotation -of compact "$f"
          done
      - name: Tratar (sem áudio, sem metadados, H.264 608x1080)
        run: |
          mkdir -p saida quadros
          for f in orig/*; do
            base=$(basename "$f"); num=$(echo "$base" | grep -oE '[0-9]+' | head -1)
            num=$(printf '%04d' "$((10#$num))"); id="HBIM-JAN-$num"
            out="saida/${id}_referencia-sem-audio_h264_v0.2.0.mp4"
            echo "$base -> $out"
            ffmpeg -nostdin -hide_banner -loglevel error -i "$f" -map 0:v:0 -an -sn -dn \
              -map_metadata -1 -map_chapters -1 \
              -vf "scale=608:1080:force_original_aspect_ratio=increase,crop=608:1080,setsar=1,fps=30" \
              -c:v libx264 -profile:v main -level:v 3.1 -preset slow -b:v 5M -maxrate 6M -bufsize 10M \
              -pix_fmt yuv420p -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv \
              -fflags +bitexact -flags:v +bitexact -movflags +faststart "$out"
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out")
            ffmpeg -nostdin -hide_banner -loglevel error -i "$out" \
              -vf "fps=12/$dur,scale=200:-2,tile=6x2:padding=4" -frames:v 1 "quadros/${id}.jpg"
          done
          for f in saida/*; do
            echo "=== $f"; ffprobe -v error -show_entries format=duration,size,bit_rate:format_tags:stream=codec_type,codec_name,profile,width,height,r_frame_rate:stream_tags -of compact "$f"
          done
          sha256sum saida/* | tee saida/SHA256SUMS-videos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quadros
          path: quadros/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: videos-tratados
          path: saida/
          retention-days: 3
          compression-level: 0
